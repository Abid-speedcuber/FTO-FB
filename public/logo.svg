<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168" fill="none">
  <title>First Block</title>
  <defs>
    <!-- Cut every logo layer away, including faces behind the open front. -->
    <mask id="front-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="168" style="mask-type:luminance">
      <rect width="320" height="168" fill="white"/>
      <path d="M108 108H212L264 160H56Z" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#front-cut)" stroke="#000" stroke-width="3.5" stroke-linejoin="round">
    <path d="M4 4H316V108L264 160H56L4 108Z" fill="#000"/>
    <g fill="#ff3038">
      <path d="M4 4L56 56 4 108Z"/>
      <path d="M4 108L56 56V160Z"/>
      <path d="M56 56L108 108 56 160Z"/>
    </g>
    <g fill="#087bff">
      <path d="M316 4V108L264 56Z"/>
      <path d="M316 108L264 160V56Z"/>
      <path d="M264 56V160L212 108Z"/>
    </g>
    <path d="M4 4H316L160 160Z" fill="#fff"/>
    <path d="M108 4L212 108M212 4L108 108M56 56H264M108 108H212M108 4L56 56M212 4L264 56M160 56L108 108M160 56L212 108"/>
  </g>
  <!-- Draw the aperture border after masking, so every edge keeps its full width. -->
  <path d="M108 108H212L264 160H56Z" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
