<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101318" />
    <script>
      try {
        const theme = localStorage.getItem("fto-theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#ffffff" : "#111418";
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FTO / First block</title>

    <!-- Static metadata is readable by link-preview crawlers without JavaScript. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FTOers" />
    <meta property="og:title" content="First Block" />
    <meta property="og:description" content="Find optimal FTO block and center solutions, explore cases, and play solutions on a virtual FTO." />

    <meta property="og:image" content="https://ftoers.web.app/FB/social-preview.png" />
